<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | FaishonNepal</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><a class="brand" href="index.html"><img class="brand-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal"></a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a><a href="account.html">Account</a></nav></header><main class="section"><p class="eyebrow">Shopping</p><h2>My Cart</h2><div id="cartItems" style="margin-top:22px"></div><div style="margin-top:22px;display:flex;gap:12px;align-items:center"><strong id="cartTotal">Total: NPR 0</strong><button class="btn primary" onclick="checkout()">Proceed to checkout</button></div></main><footer><div><img class="footer-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal"></div><div><strong>Marketplace</strong><a href="index.html">Home</a><a href="shop.html">Shop</a></div><div><strong>Account</strong><a href="orders.html">Orders</a><a href="account.html">Dashboard</a></div><div><strong>Help</strong><a href="contact.html">Contact us</a></div></footer><script>const cart=JSON.parse(localStorage.getItem('faishonCart')||'[]');const box=document.getElementById('cartItems');function render(){if(!cart.length){box.innerHTML='<div class="seller"><div><h3>Your cart is empty</h3><p>Browse products and add your favourites.</p></div><a class="btn primary" href="shop.html">Start shopping</a></div>';document.getElementById('cartTotal').textContent='Total: NPR 0';return}box.innerHTML=cart.map((p,i)=>`<div class="seller" style="margin-bottom:10px"><div class="avatar">🛍️</div><div><strong>${p.name||'Product'}</strong><p>NPR ${p.price||0}</p></div><button onclick="removeCart(${i})">Remove</button></div>`).join('');document.getElementById('cartTotal').textContent='Total: NPR '+cart.reduce((s,p)=>s+Number(p.price||0),0)}function removeCart(i){cart.splice(i,1);localStorage.setItem('faishonCart',JSON.stringify(cart));render()}function checkout(){if(!cart.length){alert('Your cart is empty');return}localStorage.setItem('faishonCheckout',JSON.stringify(cart));location.href='orders.html?checkout=1'}render();</script></body></html>
