<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — FaishonNepal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script></head><body><header class="appbar"><a class="brand" href="index.html"><img class="app-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal logo"></a><div class="appbar-actions"><a class="pill" href="index.html">← Back to shop</a></div></header><main class="login-wrap"><section class="login"><img class="login-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal logo"><h1>Welcome back</h1><p class="muted">Sign in to manage orders, wishlist and messages.</p><div id="message" class="notice" hidden></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><button id="loginBtn" class="full primary" onclick="login()">Sign in</button><p class="muted" style="text-align:center;margin-top:18px">New to FaishonNepal? <a href="auth.html" style="color:#dc143c;font-weight:700">Create account</a></p></section></main><script>function showMessage(text,error=false){const el=document.getElementById('message');el.hidden=false;el.textContent=text;el.style.color=error?'#b42318':'';}async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,btn=document.getElementById('loginBtn');if(!email||!password){showMessage('Enter your email and password.',true);return;}btn.disabled=true;btn.textContent='Signing in…';try{const {data,error}=await faishonSupabase.auth.signInWithPassword({email,password});if(error)throw error;showMessage('Signed in successfully.');setTimeout(()=>location.href='account.html',500);}catch(e){showMessage(e.message||'Login failed.',true);}finally{btn.disabled=false;btn.textContent='Sign in';}}</script></body></html>
