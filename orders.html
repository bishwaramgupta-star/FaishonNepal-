<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | FaishonNepal</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><a class="brand" href="index.html"><img class="brand-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal"></a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a><a href="account.html">Account</a></nav><a class="account" href="login.html">Sign in</a></header><main class="section"><p class="eyebrow">Customer</p><h2>My Orders</h2><div id="checkout" style="margin:22px 0;display:none"><div class="seller"><div><h3>Checkout</h3><p>Enter your delivery details. Payment method: Cash on Delivery.</p><input id="name" placeholder="Full name" style="padding:12px;width:100%;margin:5px 0"><input id="phone" placeholder="Mobile number" style="padding:12px;width:100%;margin:5px 0"><textarea id="address" placeholder="Delivery address" style="padding:12px;width:100%;margin:5px 0;min-height:90px"></textarea><button class="btn primary" onclick="placeOrder()">Place Order</button></div></div></div><div id="orderList" class="seller-grid" style="margin-top:22px"></div></main><footer><div><img class="footer-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal"></div><div><strong>Marketplace</strong><a href="index.html">Home</a><a href="shop.html">Shop</a></div><div><strong>Account</strong><a href="cart.html">Cart</a><a href="account.html">Dashboard</a></div><div><strong>Help</strong><a href="contact.html">Contact us</a></div></footer><script>let orders=JSON.parse(localStorage.getItem('faishonOrders')||'[]');const checkoutItems=JSON.parse(localStorage.getItem('faishonCheckout')||'[]');if(new URLSearchParams(location.search).get('checkout')==='1'&&checkoutItems.length)document.getElementById('checkout').style.display='block';function render(){const box=document.getElementById('orderList');if(!orders.length){box.innerHTML='<div class="seller"><div><h3>No orders yet</h3><p>Your placed orders will appear here.</p></div><a class="btn primary" href="shop.html">Shop now</a></div>';return}box.innerHTML=orders.map(o=>`<div class="seller"><div class="avatar">${o.id.slice(-2)}</div><div><strong>Order ${o.id}</strong><p>${o.status} · NPR ${o.total}</p><small>${o.items.length} item(s) · ${o.address}</small></div><button onclick="alert('Order status: '+o.status)">Track</button></div>`).join('')}function placeOrder(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();if(!name||!phone||!address){alert('Please complete delivery details');return}const total=checkoutItems.reduce((s,p)=>s+Number(p.price||0),0);const order={id:'FN'+Date.now().toString().slice(-8),status:'Pending',total,items:checkoutItems,name,phone,address,date:new Date().toLocaleDateString()};orders.unshift(order);localStorage.setItem('faishonOrders',JSON.stringify(orders));localStorage.removeItem('faishonCheckout');localStorage.removeItem('faishonCart');document.getElementById('checkout').style.display='none';history.replaceState({},'',location.pathname);render();alert('Order placed successfully! Order ID: '+order.id)}render();</script></body></html>
