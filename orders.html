<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout & Orders | FaishonNepal</title><link rel="stylesheet" href="styles.css"><style>.payment-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.pay-option{border:1px solid #ddd;border-radius:12px;padding:14px;background:#fff;cursor:pointer;text-align:center;font-weight:700}.pay-option.active{border:2px solid #dc143c;background:#fff5f7}.pay-option small{display:block;font-weight:400;color:#777;margin-top:4px}.payment-note{background:#f8f9fb;border-radius:12px;padding:14px;margin:10px 0;color:#555}.txn{display:none}.txn.show{display:block}@media(max-width:650px){.payment-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="header"><a class="brand" href="index.html"><img class="brand-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal"></a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a><a href="account.html">Account</a></nav><a class="account" href="login.html">Sign in</a></header><main class="section"><p class="eyebrow">Customer</p><h2>My Orders</h2><div id="checkout" style="margin:22px 0;display:none"><div class="seller"><div style="width:100%"><h3>Checkout</h3><p>Choose your preferred Nepal payment method.</p><input id="name" placeholder="Full name" style="padding:12px;width:100%;margin:5px 0;box-sizing:border-box"><input id="phone" placeholder="Mobile number" style="padding:12px;width:100%;margin:5px 0;box-sizing:border-box"><textarea id="address" placeholder="Delivery address" style="padding:12px;width:100%;margin:5px 0;min-height:90px;box-sizing:border-box"></textarea><h4 style="margin:16px 0 8px">Payment method</h4><div class="payment-grid"><button type="button" class="pay-option active" data-method="cod" onclick="selectPayment('cod')">💵 COD<small>Cash on Delivery</small></button><button type="button" class="pay-option" data-method="esewa" onclick="selectPayment('esewa')">🟢 eSewa<small>Digital payment</small></button><button type="button" class="pay-option" data-method="khalti" onclick="selectPayment('khalti')">🟣 Khalti<small>Digital payment</small></button><button type="button" class="pay-option" data-method="fonepay" onclick="selectPayment('fonepay')">🔵 Fonepay<small>QR / wallet</small></button></div><div id="paymentNote" class="payment-note">Cash on Delivery selected. Pay when your order is delivered.</div><div id="txnBox" class="txn"><input id="txnRef" placeholder="Payment transaction/reference ID (optional)" style="padding:12px;width:100%;margin:5px 0;box-sizing:border-box"></div><button class="btn primary" onclick="placeOrder()">Place Order</button></div></div></div><div id="orderList" class="seller-grid" style="margin-top:22px"></div></main><footer><div><img class="footer-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal"></div><div><strong>Marketplace</strong><a href="index.html">Home</a><a href="shop.html">Shop</a></div><div><strong>Account</strong><a href="cart.html">Orders</a><a href="account.html">Dashboard</a></div><div><strong>Help</strong><a href="contact.html">Contact us</a></div></footer><script>let orders=JSON.parse(localStorage.getItem('faishonOrders')||'[]');const checkoutItems=JSON.parse(localStorage.getItem('faishonCheckout')||'[]');let selectedPayment='cod';const paymentLabels={cod:'Cash on Delivery',esewa:'eSewa',khalti:'Khalti',fonepay:'Fonepay'};const paymentNotes={cod:'Cash on Delivery selected. Pay when your order is delivered.',esewa:'eSewa selected. Live eSewa checkout will be enabled after merchant credentials and a secure payment backend are configured.',khalti:'Khalti selected. Live Khalti checkout will be enabled after merchant credentials and a secure payment backend are configured.',fonepay:'Fonepay selected. Live Fonepay QR/checkout will be enabled after merchant credentials and a secure payment backend are configured.'};if(new URLSearchParams(location.search).get('checkout')==='1'&&checkoutItems.length)document.getElementById('checkout').style.display='block';function selectPayment(method){selectedPayment=method;document.querySelectorAll('.pay-option').forEach(b=>b.classList.toggle('active',b.dataset.method===method));document.getElementById('paymentNote').textContent=paymentNotes[method];document.getElementById('txnBox').classList.toggle('show',method!=='cod')}function render(){const box=document.getElementById('orderList');if(!orders.length){box.innerHTML='<div class="seller"><div><h3>No orders yet</h3><p>Your placed orders will appear here.</p></div><a class="btn primary" href="shop.html">Shop now</a></div>';return}box.innerHTML=orders.map(o=>`<div class="seller"><div class="avatar">${o.id.slice(-2)}</div><div><strong>Order ${o.id}</strong><p>${o.status} · NPR ${o.total}</p><small>${o.items.length} item(s) · ${o.paymentMethod||'Cash on Delivery'} · ${o.address}</small></div><button onclick="alert('Order status: '+o.status+'\\nPayment: '+(o.paymentMethod||'Cash on Delivery'))">Track</button></div>`).join('')}function placeOrder(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),txn=document.getElementById('txnRef').value.trim();if(!name||!phone||!address){alert('Please complete delivery details');return}if(selectedPayment!=='cod')alert(paymentLabels[selectedPayment]+' selected. Live gateway processing requires verified merchant credentials and secure server-side callback. This order will be recorded as Payment Pending until that integration is configured.');const total=checkoutItems.reduce((s,p)=>s+Number(p.price||0),0);const order={id:'FN'+Date.now().toString().slice(-8),status:selectedPayment==='cod'?'Pending':'Payment Pending',paymentMethod:paymentLabels[selectedPayment],transactionRef:txn,total,items:checkoutItems,name,phone,address,date:new Date().toLocaleDateString()};orders.unshift(order);localStorage.setItem('faishonOrders',JSON.stringify(orders));localStorage.removeItem('faishonCheckout');localStorage.removeItem('faishonCart');document.getElementById('checkout').style.display='none';history.replaceState({},'',location.pathname);render();alert('Order recorded successfully! Order ID: '+order.id)}render();</script></body></html>
