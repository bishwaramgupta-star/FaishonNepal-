<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — FaishonNepal</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script></head><body><header class="appbar"><a class="brand" href="index.html"><img class="app-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal logo"></a><div class="appbar-actions"><a class="pill" href="index.html">← Shop</a></div></header><main class="login-wrap"><section class="login"><img class="login-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal logo"><h1>Create your account</h1><p class="muted">Join FaishonNepal as a customer or seller.</p><div id="message" class="notice" hidden></div><div class="field"><label>Full name</label><input id="name" type="text" autocomplete="name" placeholder="Your full name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Mobile number (optional)</label><input id="phone" type="tel" autocomplete="tel" placeholder="98XXXXXXXX"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"></div><div class="field"><label>Account type</label><select id="role"><option value="customer">Customer</option><option value="seller">Seller</option></select></div><button id="signupBtn" class="full primary" onclick="createAccount()">Create account</button><button id="resendBtn" class="full" style="display:none;margin-top:10px" onclick="resendVerification()">Resend verification email</button><p class="muted" style="text-align:center;margin-top:18px">Already registered? <a href="login.html" style="color:#dc143c;font-weight:700">Sign in</a></p></section></main><script>function showMessage(text,error=false){const el=document.getElementById('message');el.hidden=false;el.textContent=text;el.style.color=error?'#b42318':'';}async function createAccount(){const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),phone=document.getElementById('phone').value.trim(),password=document.getElementById('password').value,role=document.getElementById('role').value;const btn=document.getElementById('signupBtn');if(!name||!email||password.length<8){showMessage('Please enter your name, a valid email and a password of at least 8 characters.',true);return;}btn.disabled=true;btn.textContent='Creating account…';try{const {data,error}=await faishonSupabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin+'/login.html',data:{full_name:name,phone,requested_role:role}}});if(error)throw error;if(data.session){await finishProfile(data.user);showMessage('Account created successfully.');setTimeout(()=>location.href=role==='seller'?'seller-dashboard.html':'account.html',700);}else{document.getElementById('resendBtn').style.display='block';showMessage('Account created. Check your email and click the verification link. Then return here and sign in.');}}catch(e){showMessage(e.message||'Could not create account.',true);}finally{btn.disabled=false;btn.textContent='Create account';}}async function finishProfile(user){const meta=user.user_metadata||{};const {error}=await faishonSupabase.from('profiles').upsert({id:user.id,full_name:meta.full_name||'',phone:meta.phone||''},{onConflict:'id'});if(error)throw error;if(meta.requested_role==='seller'){const {data:existing}=await faishonSupabase.from('seller_profiles').select('user_id').eq('user_id',user.id).maybeSingle();if(!existing){const {error:e}=await faishonSupabase.from('seller_profiles').insert({user_id:user.id,shop_name:meta.full_name||'New Seller',shop_description:'New FaishonNepal seller',business_address:'',verification_status:'pending'});if(e)throw e;}}}async function resendVerification(){const email=document.getElementById('email').value.trim();if(!email){showMessage('Enter your email first.',true);return;}const {error}=await faishonSupabase.auth.resend({type:'signup',email,options:{emailRedirectTo:window.location.origin+'/login.html'}});showMessage(error?error.message:'Verification email sent again. Please check your inbox and spam folder.',!!error);}</script></body></html>
