<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — FaishonNepal</title><link rel="stylesheet" href="app.css"></head><body><header class="appbar"><a class="brand" href="index.html"><img class="app-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal logo"></a><div class="appbar-actions"><a class="pill" href="index.html">← Shop</a></div></header><main class="login-wrap"><section class="login"><img class="login-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal logo"><h1>Create your account</h1><p class="muted">Join FaishonNepal as a customer or seller.</p><div class="field"><label>Full name</label><input id="name" type="text" autocomplete="name" placeholder="Your full name"></div><div class="field"><label>Mobile or Email</label><input id="email" type="text" autocomplete="email" placeholder="98XXXXXXXX or email@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"></div><div class="field"><label>Account type</label><select id="role"><option value="customer">Customer</option><option value="seller">Seller</option></select></div><div class="notice">Account UI is ready. Secure multi-user authentication requires connecting this project to a Supabase project and adding its public client credentials.</div><button class="full primary" onclick="prepareAccount()">Continue</button><p class="muted" style="text-align:center;margin-top:18px">Already registered? <a href="login.html" style="color:#dc143c;font-weight:700">Sign in</a></p></section></main><script>function prepareAccount(){const n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,r=document.getElementById('role').value;if(!n||!e||p.length<8){alert('Please enter your name, mobile/email and a password of at least 8 characters.');return}localStorage.setItem('faishonnepal_signup_draft',JSON.stringify({name:n,email:e,role:r}));alert('Registration form is ready. Connect Supabase to create the real account securely.');}</script></body></html>
