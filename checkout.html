<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | FaishonNepal</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="header"><a class="brand" href="index.html"><img class="brand-logo" src="faishonnepal-logo-exact%20(2).png" alt="FaishonNepal"></a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a><a href="account.html">Account</a></nav></header>
<main class="section" style="max-width:760px;margin:auto"><p class="eyebrow">Secure checkout</p><h2>Complete your order</h2><div id="summary" class="seller" style="margin:18px 0"></div>
<form id="checkoutForm" class="seller" style="display:block"><label>Delivery notes<br><textarea id="notes" rows="3" style="width:100%;margin:8px 0 16px"></textarea></label><h3>Payment method</h3><label><input type="radio" name="method" value="cod" checked> Cash on Delivery</label><br><label><input type="radio" name="method" value="esewa"> eSewa <small>(sandbox/verification pending)</small></label><br><label><input type="radio" name="method" value="khalti"> Khalti <small>(sandbox/verification pending)</small></label><br><label><input type="radio" name="method" value="fonepay"> Fonepay <small>(sandbox/verification pending)</small></label><div id="referenceWrap" style="display:none;margin-top:12px"><label>Transaction/reference ID (if already paid)<br><input id="reference" style="width:100%;margin-top:8px"></label></div><button class="btn primary" style="margin-top:20px" type="submit">Place order</button></form><p id="msg"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script>
<script>
const cart=JSON.parse(localStorage.getItem('faishonCart')||'[]');const summary=document.getElementById('summary');const msg=document.getElementById('msg');const total=cart.reduce((s,p)=>s+Number(p.price||0)*Number(p.quantity||1),0);summary.innerHTML=cart.length?`<div><strong>${cart.length} item(s)</strong><p>Total: NPR ${total.toFixed(2)}</p></div>`:'<div><strong>Your cart is empty.</strong><a class="btn primary" href="shop.html">Shop now</a></div>';
document.querySelectorAll('input[name=method]').forEach(x=>x.addEventListener('change',()=>document.getElementById('referenceWrap').style.display=x.checked&&x.value!=='cod'?'block':'none'));
document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();if(!cart.length)return;const user=await currentUser();if(!user){location.href='auth.html?redirect=checkout.html';return}const method=document.querySelector('input[name=method]:checked').value;const reference=document.getElementById('reference').value.trim()||null;const {data:order,error}=await faishonSupabase.from('orders').insert({customer_id:user.id,status:'pending',payment_method:method,payment_status:'pending',subtotal:total,delivery_fee:0,total:total,notes:document.getElementById('notes').value.trim()}).select('id,order_number').single();if(error){msg.textContent='Could not create order: '+error.message;return}const {error:pe}=await faishonSupabase.from('payments').insert({order_id:order.id,customer_id:user.id,method,status:'pending',amount:total,transaction_reference:reference,metadata:{source:'faishon_checkout',items:cart.map(p=>({name:p.name,price:p.price,quantity:p.quantity||1}))}});if(pe){await faishonSupabase.from('orders').delete().eq('id',order.id);msg.textContent='Could not create payment record: '+pe.message;return}localStorage.removeItem('faishonCart');localStorage.removeItem('faishonCheckout');msg.innerHTML=`Order <strong>${order.order_number}</strong> created successfully. Payment status: pending.`;document.getElementById('checkoutForm').style.display='none';});
</script></body></html>
